# =====================================================================
# /usr/lib/systemd/system/ssh.service.d/50-deb-harden-ssh.conf
# Hardened SSH Server Service File
# Managed by the deb-harden-ssh package
# =====================================================================

[Service]
# --- User and Group Configuration ---
User=root
Group=root

# --- Automatic Directory Provisioning ---
RuntimeDirectory=sshd
RuntimeDirectoryMode=0755

# --- Privilege and Access Restrictions ---
LockPersonality=true
MemoryDenyWriteExecute=true
PrivateDevices=true
PrivateNetwork=false
PrivateTmp=true
PrivateUsers=false
ProtectClock=true
ProtectControlGroups=true
ProtectHome=true
ProtectKernelLogs=true
ProtectKernelModules=true
ProtectKernelTunables=true
ProtectSystem=strict
ProtectUsers=true
RestrictNamespaces=true
RestrictRealtime=true
RestrictSUIDSGID=true

# --- Process and Device Visibility ---
DeviceAllow=char-rtc r
ProtectProc=invisible
ProcSubset=pid
UMask=0077

# --- Network Restrictions ---
ProtectHostname=true
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX

# --- Capability Management ---
AmbientCapabilities=
CapabilityBoundingSet=CAP_NET_BIND_SERVICE CAP_SETUID CAP_SETGID CAP_AUDIT_WRITE
NoNewPrivileges=true

# --- File System Write Restrictions ---
ReadWritePaths=/run/sshd

SystemCallArchitectures=native
SystemCallFilter=~@cpu-emulation @clock @debug @module @mount @obsolete @raw-io @reboot @resources @swap
