# =====================================================================
# /usr/lib/systemd/system/sshd@.service.d/50-deb-harden-ssh.conf
# Hardened SSH Server Service File
# Managed by the deb-harden-ssh package
# =====================================================================

[Service]
# --- Privilege and Access Restrictions ---
ProtectSystem=strict
ProtectHome=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
ProtectClock=true
ProtectKernelLogs=true
ProtectUsers=true
RestrictNamespaces=true
LockPersonality=true
MemoryDenyWriteExecute=true
RestrictSUIDSGID=true
RestrictRealtime=true
PrivateNetwork=false
PrivateDevices=true
PrivateTmp=true
PrivateUsers=false

# --- Process and Device Visibility ---
ProtectProc=invisible
ProcSubset=pid
UMask=0077

# --- Network Restrictions ---
ProtectHostname=true
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX

# --- Capability Management ---
# Instantiated worker processes require identity switching and audit logging
CapabilityBoundingSet=CAP_SETUID CAP_SETGID CAP_AUDIT_WRITE
AmbientCapabilities=
NoNewPrivileges=true

# --- File System Write Restrictions ---
ReadWritePaths=/run/sshd

# --- System Call Restrictions ---
SystemCallArchitectures=native
SystemCallFilter=~@cpu-emulation @clock @debug @module @mount @obsolete @raw-io @reboot @resources @swap
