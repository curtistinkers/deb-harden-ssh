# =====================================================================
# /etc/ssh/sshd_config.d/90-deb-harden-ssh_crypto.conf
# Hardened SSH Server Cryptograpy
# Managed by the deb-harden-ssh package
# =====================================================================

# --- Key Exchange Algorithms (KexAlgorithms) ---
# Prioritizes post-quantum hybrid schemes, followed by modern elliptic curves.
KexAlgorithms mlkem768x25519-sha256,sntrup761x25519-sha512,sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org

# --- Cipher Suites (Ciphers) ---
# Prioritizes authenticated encryption with associated data (AEAD), followed by secure counter-mode ciphers.
Ciphers aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr

# --- Message Authentication Codes (MACs) ---
# Restricts strictly to Encrypt-then-MAC (etm) variants.
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com

# --- Host Key Algorithms (HostKeyAlgorithms) ---
# Prioritizes hardware-backed and software Ed25519 certificates and keys, followed by secure RSA SHA-2.
HostKeyAlgorithms sk-ssh-ed25519-cert-v01@openssh.com,ssh-ed25519-cert-v01@openssh.com,sk-ssh-ed25519@openssh.com,ssh-ed25519,rsa-sha2-512-cert-v01@openssh.com,rsa-sha2-256-cert-v01@openssh.com,rsa-sha2-512,rsa-sha2-256

# --- Minimum RSA Key Size ---
RequiredRSASize 4096

# --- Certificate Authority Signature Algorithms (CASignatureAlgorithms) ---
CASignatureAlgorithms sk-ssh-ed25519@openssh.com,ssh-ed25519,rsa-sha2-512,rsa-sha2-256

# --- GSSAPI Key Exchange Algorithms (GSSAPIKexAlgorithms) ---
GSSAPIKexAlgorithms gss-curve25519-sha256-,gss-group16-sha512-

# --- Host-based Authentication Accepted Algorithms (HostbasedAcceptedAlgorithms) ---
HostbasedAcceptedAlgorithms sk-ssh-ed25519-cert-v01@openssh.com,ssh-ed25519-cert-v01@openssh.com,sk-ssh-ed25519@openssh.com,ssh-ed25519,rsa-sha2-512-cert-v01@openssh.com,rsa-sha2-256-cert-v01@openssh.com,rsa-sha2-512,rsa-sha2-256

# --- Public Key Accepted Algorithms (PubkeyAcceptedAlgorithms) ---
PubkeyAcceptedAlgorithms sk-ssh-ed25519-cert-v01@openssh.com,ssh-ed25519-cert-v01@openssh.com,sk-ssh-ed25519@openssh.com,ssh-ed25519,rsa-sha2-512-cert-v01@openssh.com,rsa-sha2-256-cert-v01@openssh.com,rsa-sha2-512,rsa-sha2-256
