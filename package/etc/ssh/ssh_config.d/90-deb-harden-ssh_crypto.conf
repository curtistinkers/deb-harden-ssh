# =====================================================================
# /etc/ssh/ssh_config.d/90-deb-harden-ssh_crypto.conf
# Hardened Client Cryptographic Baselines & Security Controls
# =====================================================================

Host *
    # --- Cryptographic Algorithms ---
    # Include hybrid post-quantum algorithms with standard curve25519 fallbacks
    KexAlgorithms mlkem768x25519-sha256,sntrup761x25519-sha512,sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org

    Ciphers aes256-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-gcm@openssh.com,aes128-ctr

    MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com

    HostKeyAlgorithms ssh-ed25519-cert-v01@openssh.com,sk-ssh-ed25519-cert-v01@openssh.com,ssh-ed25519,rsa-sha2-512-cert-v01@openssh.com,rsa-sha2-256-cert-v01@openssh.com,rsa-sha2-512,rsa-sha2-256

    RequiredRSASize 4096

    # --- Host Key Verification & Privacy ---
    StrictHostKeyChecking ask
    HashKnownHosts yes

    # --- Session Resilience ---
    ServerAliveInterval 60
    ServerAliveCountMax 3
