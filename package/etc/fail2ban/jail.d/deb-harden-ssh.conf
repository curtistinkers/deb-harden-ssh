# =====================================================================
# /etc/fail2ban/jail.d/deb-harden-ssh.conf
# Managed by the deb-harden-ssh package
# =====================================================================

[sshd]
enabled  = true
port     = ssh
mode     = aggressive
backend  = systemd
maxretry = 3
findtime = 10m
bantime  = 1h

# Incremental ban times for repeat offenders
bantime.increment = true
bantime.factor    = 2
bantime.maxtime   = 4w
